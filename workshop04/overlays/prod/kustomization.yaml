---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: prod

patches:
- target:
    version: v1
    kind: Secret
    name: rustfs-secret
  path: secret-patch.yaml
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: rustfs-sts
  path: sts-patch.yaml
- target:
    group: gateway.networking.k8s.io
    version: v1
    kind: HTTPRoute
    name: rustfs-data-httproute
  path: data-route-patch.yaml
- target:
    group: gateway.networking.k8s.io
    version: v1
    kind: HTTPRoute
    name: rustfs-console-httproute
  path: console-route-patch.yaml
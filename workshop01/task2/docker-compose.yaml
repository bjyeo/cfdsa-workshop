services:
  mydb:
    image: stackupiss/northwind-db:v1
    volumes:
      - mydb-data:/var/lib/mysql
    networks:
      - mynet

  myapp:
    image: stackupiss/northwind-app:v1
    environment:
      DB_HOST: mydb
      DB_USER: root
      DB_PASSWORD: changeit
    ports:
      - "8080:3000"
    networks:
      - mynet

networks:
  mynet:
    name: mynet

volumes:
  mydb-data:
